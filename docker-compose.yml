version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: multichat_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - multichat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multichat_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/multi-chat
      - JWT_SECRET=supersecretjwtkey_12345
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - multichat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multichat_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - multichat-network

volumes:
  mongo_data:
  backend_uploads:

networks:
  multichat-network:
    driver: bridge

